<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/billeasy.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>BillEasy</title>
  </head>
  <body>
    <div id="root">
      <!-- Inline fallback loader — shown before React mounts -->
      <div id="preload-spinner" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#fff7ed;">
        <div style="text-align:center">
          <div style="width:40px;height:40px;border:4px solid #fb923c;border-top-color:transparent;border-radius:50%;margin:0 auto 12px;animation:prespin 1s linear infinite"></div>
          <p style="color:#78716c;font-size:14px;font-weight:500;font-family:Inter,system-ui,sans-serif;margin:0;">Starting BillEasy…</p>
        </div>
      </div>
      <style>@keyframes prespin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
